name: Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

jobs:
  sonarqube:
    name: Tests PHPUnit et SonarQube
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: grandecinema_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: xdebug, pdo_mysql
          coverage: xdebug
          tools: composer:v2

      - name: Create environment file
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          APP_DEBUG=1
          APP_SECRET=github-actions-test-secret
          DEFAULT_URI=http://localhost
          DATABASE_URL="mysql://root:root@127.0.0.1:3306/grandecinema_test?serverVersion=10.11.0-MariaDB&charset=utf8mb4"
          TURNSTILE_SECRET_KEY=test-secret-key
          TURNSTILE_SITE_KEY=test-site-key
          MAILER_DSN=null://null
          MESSENGER_TRANSPORT_DSN=in-memory://
          STRIPE_SECRET_KEY=sk_test_dummy
          EOF

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Verify Symfony configuration
        run: php bin/console about --env=test

      - name: Create test database
        run: php bin/console doctrine:database:create --if-not-exists --env=test

      - name: Create database schema
        run: php bin/console doctrine:schema:create --env=test

      - name: Create coverage directory
        run: mkdir -p var/coverage

      - name: Run PHPUnit with coverage
        run: php -d xdebug.mode=coverage bin/phpunit --coverage-clover var/coverage/clover.xml

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}