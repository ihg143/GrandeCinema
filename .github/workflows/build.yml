
name: Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: grandecinema
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: xdebug
          coverage: xdebug
          tools: composer:v2

      - name: Create environment file
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          APP_SECRET=github-actions-test-secret
          DEFAULT_URI=http://localhost
          DATABASE_URL="mysql://root:root@127.0.0.1:3306/grandecinema?serverVersion=10.11.0-MariaDB"
          EOF

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Create coverage directory
        run: mkdir -p var/coverage

      - name: Run PHPUnit with coverage
        run: php -d xdebug.mode=coverage bin/phpunit --coverage-clover var/coverage/clover.xml

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
