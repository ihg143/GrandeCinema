sonar.projectKey=ihg143_GrandeCinema
sonar.organization=ihg143

sonar.sourceEncoding=UTF-8

# Dossiers du code source
sonar.sources=src,assets,public/js

# Dossiers des tests
sonar.tests=tests

# Exclusions du code source
sonar.exclusions=\
    var/**,\
    vendor/**,\
    migrations/**,\
    config/**,\
    public/bundles/**,\
    assets/controllers/hello_controller.js

# Fichiers de tests
sonar.test.inclusions=tests/**

# Rapport de couverture PHPUnit
sonar.php.coverage.reportPaths=var/coverage/clover.xml